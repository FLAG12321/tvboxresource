name: 自动更新TVBox多仓源并同步Gitee

on:
  schedule:
    - cron: '0 */6 * * *'
  push:
    branches: [master]
    paths: [update.py]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装Python依赖
        run: pip install requests

      - name: 执行更新脚本
        run: python update.py

      - name: 提交更新到GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add multi.json merged.json single_list.json
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "自动更新源 $(TZ=Asia/Shanghai date +%Y-%m-%d_%H:%M)"
            git push
          fi

      - name: 配置SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.GITEE_SSH_KEY }}

      - name: 同步到Gitee
        run: |
          ssh-keyscan -t ed25519 gitee.com >> ~/.ssh/known_hosts 2>/dev/null
          git remote add gitee git@gitee.com:flag12321/tvbox.git 2>/dev/null || true
          git push gitee HEAD:master --force
